[project]
name = "sensetree-research"
version = "0.1.0"
description = "Retrieval evaluation and embedding adaptation experiments for SenseTree"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8.9",
    "huggingface-hub>=0.30",
    "lancedb>=0.40",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pypdf>=6.0",
    "python-docx>=1.2.0",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4",
    "sentence-transformers>=3.3",
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sensetree_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
