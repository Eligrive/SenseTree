[package]
name = "sensetree"
version = "3.9.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sensetree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
lancedb = "0.31"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
# Televersement EN FLUX des medias : sans lui il faudrait charger un fichier de
# plusieurs Go entierement en memoire avant de pouvoir l envoyer. Deja dans l arbre.
tokio-util = { version = "0.7", features = ["io"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify-debouncer-mini = "0.7.0"
infer = "0.19.0"
walkdir = "2.5.0"
pdf-extract = "0.12.0"
lopdf = "0.42"
# Les images JPEG d'un PDF sont souvent ENVELOPPEES dans une compression Flate
# (chaine de filtres [FlateDecode, DCTDecode]). lopdf est compile sans ses
# algorithmes de decompression, on inflate donc nous-memes. Deja present dans
# l'arbre de dependances : aucun cout de compilation supplementaire.
flate2 = "1"
zip = "8.6.0"
# Rendu des pages PDF en images. Un scan n'est PAS « une image par page » : ses
# pages sont souvent decoupees en couches (un JPEG de fond + le texte en
# CCITTFaxDecode/JBIG2), quand elles ne sont pas en pixels bruts ou vectorielles.
# Extraire les images embarquees ne donne alors rien d'exploitable au modele de
# vision ; il faut DESSINER la page. hayro le fait en Rust pur : aucun binaire
# natif a livrer ni a telecharger, et tout son arbre est sous licence permissive
# (MIT / Apache-2.0 / BSD-3 / Zlib), ce que la revente de l'app impose.
hayro = "0.7"
# hayro 0.7.1 depend de vello_cpu 0.0.8, que glifo 0.1.1 casse (signatures du
# trait de rendu modifiees). A relever des que hayro publie une version alignee.
glifo = "=0.1.0"
# Encodage JPEG des pages rendues. Deja dans l'arbre de dependances : les
# features demandees ici s'y ajoutent sans cout de compilation supplementaire.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
arrow-array = "59.0.0"
arrow-schema = "59.0.0"
futures-util = "0.3.32"
# ONNX Runtime chargé DYNAMIQUEMENT (via ORT_DYLIB_PATH) : on fournit nous-mêmes
# la lib ORT (CPU ou GPU) au runtime → un seul binaire, choix GPU/CPU sans recompiler.
fastembed = { version = "4", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }
# ort en direct (même version que fastembed, load-dynamic partagé) pour pouvoir
# demander le provider CUDA au runtime.
ort = { version = "=2.0.0-rc.9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking", "multipart"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

