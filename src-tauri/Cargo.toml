[package]
name = "sensetree"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sensetree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# CUDA est OPT-IN (jamais par défaut). Raison : activer `ort/cuda` force TOUT
# ONNX Runtime (fastembed inclus) à charger le binaire CUDA d'ORT, qui ÉCHOUE à
# s'initialiser sur une machine sans runtime CUDA (« Failed to initialize ORT
# API ») — ce n'est pas un repli CPU gracieux. Le build par défaut reste donc CPU
# (portable partout). Pour le GPU, compiler SUR une machine NVIDIA + CUDA avec :
#   tauri build -- --features cuda        (ou `cargo build --features cuda`)
# La case « Utiliser le GPU » n'a d'effet que sur un binaire ainsi compilé.
# Pour offloader l'indexation sur un GPU distant sans build CUDA : utiliser le
# mode embedding « Serveur HTTP » pointé sur un autre PC (déjà supporté).
cuda = ["dep:ort", "ort/cuda"]

[dependencies]
# ort n'est tiré directement que pour la feature `cuda` (fastembed l'embarque
# déjà en transitif ; on aligne la version pour l'unification de features).
ort = { version = "=2.0.0-rc.9", default-features = false, optional = true }
anyhow = "1"
crossbeam-channel = "0.5"
lancedb = "0.31"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
notify-debouncer-mini = "0.7.0"
infer = "0.19.0"
walkdir = "2.5.0"
pdf-extract = "0.12.0"
zip = "8.6.0"
arrow-array = "59.0.0"
arrow-schema = "59.0.0"
futures-util = "0.3.32"
fastembed = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

