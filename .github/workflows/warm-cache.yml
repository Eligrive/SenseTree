name: 'warm-cache'

# Réchauffe le cache de compilation Rust sur la branche par défaut (main).
#
# Pourquoi : le build de release est déclenché par un TAG, et le cache GitHub Actions
# est CLOISONNÉ par ref — un cache sauvé sous le tag `v1.3.1` est invisible depuis le
# build du tag `v1.3.2`. Seuls les caches de `main` sont lisibles par tous les refs.
# Comme rien ne compilait jamais sur `main`, chaque release repartait à froid (~1h40,
# dont ~1h30 à recompiler ort/lancedb/arrow…).
#
# Ce job compile donc les (lourdes) dépendances sur `main` pour peupler le cache. Les
# builds de release (release.yml, même `shared-key`) le restaurent au lieu de tout
# recompiler → de ~1h40 à ~10-15 min dès la release suivante.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/warm-cache.yml'

# Un seul réchauffage à la fois ; un nouveau push annule le précédent.
concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'tauri-release'

      # Le script de build Tauri lit `frontendDist` (../dist) via generate_context!,
      # donc le frontend doit exister pour que `cargo build` du crate final aboutisse.
      - name: install frontend dependencies
        run: npm ci

      - name: build frontend
        run: npm run build

      - name: build (réchauffe le cache des dépendances Rust)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
