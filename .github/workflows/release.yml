name: 'publish'

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on push of tags matching v*, e.g., v0.1.0

jobs:
  publish-tauri:
    permissions:
      contents: write # Required to create and write to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest' # Builds the Windows .exe / .msi installer
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # LanceDB (lance-encoding) compile des .proto au build : protoc est requis et
      # n'est pas préinstallé sur le runner windows-latest.
      - name: install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Restaure le cache réchauffé sur `main` par le workflow warm-cache. `shared-key`
      # fixe : indispensable pour que ce build (déclenché par un TAG) retrouve le cache
      # de `main` — les caches d'un autre tag ne sont jamais visibles entre eux.
      # `save-if: false` : ce build ne sauve rien (le cache est produit par warm-cache),
      # ça évite ~1-2 min d'upload d'un cache de tag qui ne resservirait jamais.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'tauri-release'
          save-if: 'false'

      - name: install frontend dependencies
        run: npm ci

      # Build and compile your Tauri app, generating the production installer
      - name: build and package Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des artefacts d'auto-update (clé générée par `tauri signer`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # Automatically resolved from src-tauri/tauri.conf.json
          releaseName: 'SenseTree v__VERSION__'
          releaseBody: 'Review and download the latest installer below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
